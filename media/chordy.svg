<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Chordy, the Earth Jukebox guide">
  <!-- Chordy: a round creature whose body is a little chord of sound bars -->
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9ff2e5"/>
      <stop offset="1" stop-color="#2f9e93"/>
    </radialGradient>
  </defs>
  <circle cx="48" cy="52" r="36" fill="url(#body)" stroke="#0b1418" stroke-width="3"/>
  <!-- sound bars on top, like a chord -->
  <g fill="#ffc784" stroke="#0b1418" stroke-width="2.5" stroke-linejoin="round">
    <rect x="25" y="9" width="9" height="22" rx="4.5"/>
    <rect x="37" y="3" width="9" height="28" rx="4.5"/>
    <rect x="49" y="7" width="9" height="24" rx="4.5"/>
    <rect x="61" y="13" width="9" height="18" rx="4.5"/>
  </g>
  <!-- face -->
  <circle cx="37" cy="50" r="6" fill="#fff" stroke="#0b1418" stroke-width="2"/>
  <circle cx="59" cy="50" r="6" fill="#fff" stroke="#0b1418" stroke-width="2"/>
  <circle cx="38" cy="51" r="2.8" fill="#0b1418"/>
  <circle cx="60" cy="51" r="2.8" fill="#0b1418"/>
  <path d="M38 65 q10 8 20 0" fill="none" stroke="#0b1418" stroke-width="3" stroke-linecap="round"/>
  <!-- a little sound wave on the cheek -->
  <path d="M70 60 q3 -3 6 0 t6 0" fill="none" stroke="#0b1418" stroke-width="2" stroke-linecap="round"/>
</svg>
