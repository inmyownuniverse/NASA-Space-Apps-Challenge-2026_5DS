<!DOCTYPE html>
<meta charset="utf-8" />
<title>Terratone — final Data & Vision QA</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  h1 { font-size: 16px; }
  pre { background: #000; padding: 10px; max-height: 70vh; overflow: auto; font-size: 12px; }
  .ok { color: #6f6; } .bad { color: #f66; }
</style>
<h1>Final QA — real video elements, HTTP Range server</h1>
<div id="progress">starting…</div>
<pre id="out">waiting</pre>
<script type="module">
import { analyze, resetAnalyzer } from '../../js/analyzer.js';

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

const files = await (await fetch('../../datasets/index.json')).json();
const cfgs = [];
for (const f of files) cfgs.push(await (await fetch('../../datasets/' + f)).json());

const video = document.createElement('video');
video.muted = true;
video.playsInline = true;
video.preload = 'auto';
document.body.append(video);
video.style.width = '320px';

const log = [];
const results = {};
const $out = document.getElementById('out');
const $prog = document.getElementById('progress');
function note(s) { $prog.textContent = s; }

function loadVideo(src) {
  return new Promise((resolve, reject) => {
    video.onloadeddata = () => resolve();
    video.onerror = () => reject(new Error('video error: ' + (video.error?.code ?? '?')));
    video.src = src;
    video.load();
  });
}

function seekTo(t) {
  return new Promise((resolve, reject) => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
    setTimeout(() => reject(new Error('seek timeout at ' + t)), 15000);
  });
}

function summary(features) {
  const grid = features.grid ?? [];
  const vals = grid.filter((v) => v !== null && v !== undefined);
  const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? Math.round(v * 1000) / 1000 : v);
  return {
    mean: num(features.mean),
    max: num(features.max),
    change: num(features.change),
    cells: grid.length,
    validCells: vals.length,
    nullCells: grid.length - vals.length,
    min: vals.length ? num(Math.min(...vals)) : null,
    maxCell: vals.length ? num(Math.max(...vals)) : null,
    flashes: features.flashes?.length ?? 0,
    flashSample: features.flashes?.slice(0, 2) ?? [],
    flashSpace: features.flashSpace,
    flashGlobe: features.flashGlobe,
    flashRejected: features.flashRejected,
    layers: features.layers && Object.keys(features.layers).length
      ? Object.fromEntries(Object.entries(features.layers).map(([k, v]) => [k, Math.round(v * 1000) / 1000])) : features.layers,
    aerosolPixels: features.aerosolPixels,
    aerosolAmbiguous: features.aerosolAmbiguous,
    aerosolMasked: features.aerosolMasked,
    phase: features.phase,
    columns: (features.columns ?? []).length,
    columnNulls: (features.columns ?? []).filter((v) => v === null).length,
  };
}

async function probe(cfg, times) {
  const out = [];
  resetAnalyzer();
  for (const t of times) {
    await seekTo(t);
    const t0 = performance.now();
    const features = analyze(video, cfg);
    const ms = performance.now() - t0;
    out.push({
      requested: t,
      currentTime: Math.round(video.currentTime * 1000) / 1000,
      readyState: video.readyState,
      seekable: video.seekable.length ? `${video.seekable.start(0)}-${video.seekable.end(0)}` : 'none',
      ms: Math.round(ms * 10) / 10,
      ...summary(features),
    });
  }
  return out;
}

try {
  for (const cfg of cfgs) {
    note('loading ' + cfg.id + ' …');
    await loadVideo('../../' + cfg.video);
    const dur = video.duration;
    const entry = { video: cfg.video, duration: Math.round(dur * 100) / 100, size: `${video.videoWidth}×${video.videoHeight}` };

    if (cfg.id === 'sst') {
      entry.probes = await probe(cfg, [2, 10, 25]);
      // play / pause
      const t0 = video.currentTime;
      await video.play();
      await new Promise((r) => setTimeout(r, 1200));
      const moved = video.currentTime > t0 + 0.3;
      video.pause();
      entry.playback = { advanced: moved, from: Math.round(t0 * 100) / 100, to: Math.round(video.currentTime * 100) / 100 };
      // seek resets change to 0
      resetAnalyzer();
      await seekTo(4);
      entry.changeAfterSeek = analyze(video, cfg).change;
    }

    if (cfg.id === 'nightlights') {
      entry.probes = await probe(cfg, [3, 12, 25]);
      entry.segments = cfg.segments;
    }

    if (cfg.id === 'lightning') {
      entry.probes = await probe(cfg, [90, 90.25, 90.5, 120]);
      // Continuous playback: persistent strikes must NOT be reported again on the
      // next frame. Play a short 4 Hz sequence and measure position overlap.
      resetAnalyzer();
      await seekTo(150);
      analyze(video, cfg);
      const seq = [];
      for (let i = 1; i <= 6; i++) {
        await seekTo(150 + i * 0.25);
        const f = analyze(video, cfg);
        seq.push({ t: Math.round(video.currentTime * 100) / 100, flashes: f.flashes.length, cells: f.flashes.map((e) => e.cell) });
      }
      const overlaps = seq.slice(1).map((s2, i) => {
        const prevCells = new Set(seq[i].cells);
        const shared = s2.cells.filter((c) => prevCells.has(c)).length;
        return { t: s2.t, flashes: s2.flashes, repeatedCells: shared };
      });
      entry.retrigger = { sequence: seq.map((s2) => s2.flashes), overlap: overlaps };
      // A seek across a cut must clear temporal tracking.
      await seekTo(30);
      const c = analyze(video, cfg);
      entry.afterSeekFlashes = c.flashes.length;
      entry.afterSeekChange = c.change;
    }

    if (cfg.id === 'aerosols') {
      entry.probes = await probe(cfg, [0, 20, 36.633]);
    }

    results[cfg.id] = entry;
    log.push('done ' + cfg.id);
  }
} catch (err) {
  log.push('ERROR: ' + err.message);
}

window.__qa = { results, errors, log, done: true };
$out.textContent = JSON.stringify(window.__qa, null, 2);
note('done');
</script>
